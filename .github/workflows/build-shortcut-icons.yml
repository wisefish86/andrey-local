name: Build shortcut icons
on:
  push:
    paths:
      - 'Ресурсы/Иконки/icon-map.json'
      - 'Скрипты/Система ярлыков/build_icons.py'
      - '.github/workflows/build-shortcut-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon tools
        run: python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==11.3.0'
      - name: Build SVG and ICO
        run: python 'Скрипты/Система ярлыков/build_icons.py'
      - name: Commit generated icons
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Ресурсы/Иконки/SVG' 'Ресурсы/Иконки/ICO'
          if ! git diff --cached --quiet; then
            git commit -m 'Build Lucide shortcut icon assets'
            git push
          fi

name: Setlist editor checks
on:
  push:
    paths:
      - "Скрипты/Пение/Добавление минуса в репертуар/Инструменты репертуара/Конструктор плейлистов/**"
      - "Скрипты/Пение/_common/id3_io.py"
      - ".github/workflows/setlist-editor-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Qt libraries
        run: sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install test libraries
        run: python -m pip install "mutagen==1.47.0" "PySide6==6.10.0"
      - name: Compile GUI and core
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base = Path("Скрипты/Пение/Добавление минуса в репертуар/Инструменты репертуара/Конструктор плейлистов")
          for path in [*base.glob("*.py"), *base.glob("*.pyw")]:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python syntax OK")
          PY
      - name: Run unit and GUI smoke tests
        run: |
          python -m unittest discover -s "Скрипты/Пение/Добавление минуса в репертуар/Инструменты репертуара/Конструктор плейлистов/tests" -p "test_*.py" -v
